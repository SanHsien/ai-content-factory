[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-factory"
version = "0.1.0"
description = "Offline-first, provider-neutral AI content planning and packaging pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI Content Factory contributors" }]
dependencies = []

[project.optional-dependencies]
openai-image = ["openai==2.46.0"]

[project.scripts]
ai-content-factory = "ai_content_factory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_content_factory = ["fixtures/synthetic/*"]
