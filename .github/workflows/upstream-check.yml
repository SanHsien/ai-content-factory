name: Upstream check

on:
  push:
    branches: [main]
    paths:
      - tools/check_upstream_updates.py
      - tools/upstream_baseline.json
      - .github/workflows/upstream-check.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # Job-scoped on purpose. One step already asks `gh` for the fork parent
      # with its own step-level token; the checker now also shells out to `gh`
      # for the upstream PR and issue lists, and it fails closed (exit 2) when
      # it cannot enumerate them — which would read as "checker broken" rather
      # than "token missing".
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Add GitHub fork parent as upstream remote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.clone_url // empty')"
          if [ -z "$parent" ]; then
            echo "No GitHub fork parent; leaving remotes unchanged."
            exit 0
          fi
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$parent"

      - name: Check upstream
        id: upstream
        continue-on-error: true
        run: python tools/check_upstream_updates.py --strict

      - name: Publish report
        if: always()
        run: cat upstream-review-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require review when upstream changed
        if: steps.upstream.outcome == 'failure'
        run: |
          echo "::error::Upstream changed or the check failed. Review the workflow summary."
          exit 1
